<!doctype html><html lang="ko"><meta charset="utf-8"><title>v4 viewport QA</title>
<style>body{margin:0;padding:12px;background:#dde3dd;font:14px system-ui}label{display:block;margin-bottom:10px}iframe{display:block;border:0;background:white}#result{white-space:pre-wrap}button,select{padding:8px}</style>
<label>검증 뷰포트 <select id="viewport"><option>320×568</option><option>360×800</option><option>375×812</option><option selected>390×844</option><option>430×932</option><option>768×1024</option><option>1280×900</option></select></label>
<button id="inspect">현재 게임 화면 검사</button><pre id="result" role="status"></pre>
<iframe title="검은 숲 v4 검증" id="game" src="index.html" width="390" height="844"></iframe>
<script>const frame=document.getElementById('game'),viewport=document.getElementById('viewport');viewport.onchange=()=>{const [w,h]=viewport.value.split('×');frame.width=w;frame.height=h;};document.getElementById('inspect').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,visible=e=>e.getClientRects().length>0;const panel=d.getElementById('bf-panel'),r=panel.getBoundingClientRect();const images=[...d.images].filter(visible);document.getElementById('result').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,panel:panel.hidden?'closed':{x:r.x,y:r.y,width:r.width,height:r.height,inBounds:r.x>=0&&r.y>=0&&r.right<=w.innerWidth+1&&r.bottom<=w.innerHeight+1},brokenImages:images.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),imageOverflow:images.filter(i=>{const r=i.getBoundingClientRect();return r.x<0||r.right>w.innerWidth+1}).map(i=>i.getAttribute('src'))},null,2);};</script></html>
