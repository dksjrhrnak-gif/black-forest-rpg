name: Handoff audit and requested mobile sizes
on:
  push:
    branches: [qa/handoff-audit-20261008, qa/resume-checkpoint-20261008, qa/asset-quality-20261008, qa/p1-class-identity-20261008, feature/p2-exploration-equipment, feature/p3-economy-crafting-endings, qa/gameplay-handoff-20261012, qa/fx-feedback-pass, qa/ui-b-mobile-pass, qa/single-screen-mobile-ui, feature/forced-boss-career, main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node test-forced-career.cjs
      - run: node test-pr8-pr9-integration.cjs
      - run: node test-fx.cjs
      - run: node test-ui-b-invariants.cjs
      - run: node test-audit-data.cjs
      - run: node test-p3.cjs
      - run: node test-p3-combat.cjs
      - run: node simulate-p3-economy.cjs
      - run: node test-p2.cjs
      - run: node test-p2-natural.cjs
      - run: node test-p2-equipment.cjs
      - run: node test-p1-identity.cjs
        env:
          BF_P1_OUT: docs/p2/p1-effect-comparison.json
      - name: Fixed-seed gameplay audit and natural save continuity
        env:
          BF_AUDIT_OUT: docs/p2/regression
        run: node audit-gameplay-quality.cjs all
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-data
          path: |
            docs/pr8-pr9-integration/**/*.json
            docs/p2/**/*.json
            docs/p1/comparison.json
            docs/p3/**/*.json
            docs/fx/**/*.json
      - run: python3 build.py && node export-data.cjs && python3 export-site.py && python3 verify-html.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        interaction: [click, touch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: python3 build.py && node export-data.cjs && python3 export-site.py && python3 verify-html.py
      - run: python3 -m http.server 4173 > /tmp/bf-audit.log 2>&1 &
      - name: Exact requested sizes, controls and journey regressions
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4173/
          BF_VIEWPORTS: '[{"width":360,"height":800},{"width":375,"height":667},{"width":390,"height":844},{"width":393,"height":852},{"width":430,"height":932}]'
          BF_AUDIT_CONTROLS: '1'
          BF_INTERACTION: ${{ matrix.interaction }}
        run: |
          if [ "$BF_INTERACTION" = touch ]; then npm run test:mobile; else npm run test:browser; fi
      - name: Starter, panel, file import and image fallback handoff checks
        if: matrix.interaction == 'touch'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4173/
        run: node test-handoff-readiness.cjs
      - name: Dedicated portraits and reward comparison visual checks
        if: matrix.interaction == 'touch'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4173/
        run: node test-quality-mobile.cjs
      - name: P1 old battle saves, career skills and status reload
        if: matrix.interaction == 'touch'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4173/
        run: node test-p1-ui.cjs
      - name: P2 regional choices, battle, equipment and saved reactions
        if: matrix.interaction == 'touch'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4173/
        run: node test-p2-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-${{ matrix.browser }}-${{ matrix.interaction }}
          path: |
            browser-results.txt
            mobile-results*.txt
            handoff-readiness-*.json
            docs/gameplay/mobile-quality-*.json
            docs/p1/ui-*.json
            docs/p2/ui-*.json
            screenshots/

  live-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for this commit to finish Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node wait-pages-deployment.cjs
      - name: Public single-screen bounds, full story and unchanged saves
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_SINGLE_OUT: docs/pr8-pr9-integration/single-screen-public
        run: |
          node test-single-screen.cjs
          node test-single-screen-layout.cjs
      - name: Public P1 old-save and skill QA
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
        run: node test-p1-ui.cjs
      - name: Public P2 regional choices and saved story reactions
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
        run: node test-p2-ui.cjs
      - name: Match the deployed game and all mapped assets
        env:
          BF_HTTP_BASE: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_EXPECT_LIVE: '1'
        run: node test-http-assets.cjs
      - name: Play the published game at the requested mobile sizes
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_VIEWPORTS: '[{"width":360,"height":800},{"width":390,"height":844},{"width":430,"height":932}]'
          BF_AUDIT_CONTROLS: '1'
        run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-live-${{ matrix.browser }}
          path: |
            docs/pr8-pr9-integration/
            pages-http-results.json
            docs/p1/ui-*.json
            docs/p2/ui-*.json
            mobile-results*.txt
            screenshots/

  p3-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: python3 build.py && node export-data.cjs && python3 export-site.py && python3 verify-html.py
      - run: python3 -m http.server 4174 --directory dist > /tmp/bf-p3-preview.log 2>&1 &
      - name: Wait for preview server readiness
        run: node -e '(async()=>{for(let i=0;i<100;i++){try{if((await fetch("http://127.0.0.1:4174/")).ok)return}catch{}await new Promise(r=>setTimeout(r,100))}throw Error("Preview server unavailable")})().catch(e=>{console.error(e);process.exit(1)})'
      - name: Boss reward, forced career choice, saves and mobile FX compatibility
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
          BF_PROMO_OUT: docs/pr8-pr9-integration/forced
        run: node test-forced-career-ui.cjs
      - name: P3 real-campaign imports, economy, sets, save and endings at five widths
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
        run: node test-p3-ui.cjs
      - name: FX mobile, reduced motion, rapid input, save and special moments
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
        run: node test-fx-ui.cjs
      - name: FX bounded feedback under CPU throttling
        if: matrix.browser == 'chromium'
        env:
          BF_QA_URL: http://127.0.0.1:4174/
        run: node test-fx-performance.cjs
      - name: B UI exact action geometry, all skills/events and before/after evidence
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
        run: node test-ui-b.cjs
      - name: Capture the reviewed PR baseline in this browser
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/ui-review-before.html
          BF_REVIEW_BASELINE: '1'
        run: |
          git show 1881f2b1181ece2c8240365983710bbd6f4bc5ed:index.html > dist/ui-review-before.html
          node test-ui-review.cjs
      - name: PR 7 follow-up scroll, HUD, career, reward and equipment QA
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
        run: node test-ui-review.cjs
      - name: Mobile single-screen baseline at four real viewport sizes
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/single-before.html
          BF_SINGLE_BEFORE: '1'
          BF_SINGLE_OUT: docs/pr8-pr9-integration/single-screen
        run: |
          git show 8869de4f651dc97e9b8cf8faec356cce31a913cd:index.html > dist/single-before.html
          node test-single-screen.cjs
      - name: Mobile single-screen bounds, story access and unchanged saves
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: http://127.0.0.1:4174/
          BF_SINGLE_OUT: docs/pr8-pr9-integration/single-screen
        run: |
          node test-single-screen.cjs
          node test-single-screen-layout.cjs
      - name: Wait for this commit to finish Pages deployment
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node wait-pages-deployment.cjs
      - name: Public first third sixth boss promotions and saves
        if: github.ref == 'refs/heads/main'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_PROMO_OUT: docs/pr8-pr9-integration/public
        run: node test-forced-career-ui.cjs
      - name: P3 public game at five widths
        if: github.ref == 'refs/heads/main'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_P3_OUT: docs/p3/public
        run: node test-p3-ui.cjs
      - name: FX public game at three mobile widths and both motion modes
        if: github.ref == 'refs/heads/main'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_FX_OUT: docs/fx/public
        run: node test-fx-ui.cjs
      - name: B UI public action geometry and panels at three widths
        if: github.ref == 'refs/heads/main'
        env:
          BF_BROWSER: ${{ matrix.browser }}
          BF_QA_URL: https://dksjrhrnak-gif.github.io/black-forest-rpg/
          BF_UI_PHASE: '5'
          BF_UI_OUT: docs/ui-b/public
          BF_UI_SHOTS: '0'
        run: node test-ui-b.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-${{ matrix.browser }}
          path: |
            docs/single-screen/
            docs/forced-career/
            docs/pr8-pr9-integration/
            docs/p3/ui-*.json
            docs/p3/public/ui-*.json
            screenshots/p3/
            docs/fx/**/*.json
            screenshots/fx/
            docs/ui-b/**/*.json
            docs/ui-b/screenshots/
            docs/ui-b/review/screenshots/
