<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>검은 숲의 방랑자 — 잊힌 비전</title><style>body{margin:0;padding:20px;background:light-dark(#e7ebe2,#0d1310);font-family:system-ui}@media(max-width:600px){body{padding:0}}</style></head><body>

-game progress::-moz-progress-bar{background:var(--bf-accent)}#black-forest-game .layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:26px}#black-forest-game .main{min-width:0}#black-forest-game .story{white-space:pre-line;margin:18px 0 24px;line-height:1.95;min-height:105px}#black-forest-game .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#black-forest-game .actions button{display:flex;flex-direction:column;gap:3px}#black-forest-game .actions button span{font-size:12px;opacity:.8}#black-forest-game .actions .wide{grid-column:1/-1}#black-forest-game aside{border-left:1px solid var(--bf-line);padding-left:23px}#black-forest-game .sideblock{margin-bottom:24px}#black-forest-game .item{padding:10px 0;border-bottom:1px solid var(--bf-line)}#black-forest-game .enemy{padding:16px;background:var(--bf-tint);margin:18px 0;border-radius:10px}#black-forest-game .enemy .intent{color:var(--bf-danger);margin-top:10px;font-size:13px}#black-forest-game .route{display:flex;gap:8px;margin:18px 0;align-items:center;flex-wrap:wrap}#black-forest-game .step{border:1px solid var(--bf-line);border-radius:50%;width:30px;height:30px;text-align:center;font-size:12px;line-height:28px}#black-forest-game .step.done{background:var(--bf-accent);color:var(--bf-on);border-color:var(--bf-accent)}#black-forest-game .step.current{outline:2px solid var(--bf-accent);outline-offset:2px}#black-forest-game .divider{height:1px;background:var(--bf-line);margin:22px 0}#black-forest-game .footer{border-top:1px solid var(--bf-line);margin-top:26px;padding-top:14px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}#black-forest-game .classcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}#black-forest-game .classcards button{padding:20px 16px}#black-forest-game .classcards b{font-size:20px;font-weight:500;display:block;margin-bottom:10px}#black-forest-game .panel{margin-top:20px;border-top:1px solid var(--bf-line);padding-top:20px}#black-forest-game .panel[hidden]{display:none}#black-forest-game textarea{width:100%;height:130px;resize:vertical;font:13px/1.6 monospace;background:var(--bf-panel);color:var(--bf-ink);border:1px solid var(--bf-line);border-radius:8px;padding:12px;margin:10px 0;overflow-wrap:anywhere}#black-forest-game .error{color:var(--bf-danger)}#black-forest-game a{color:var(--bf-accent)}#black-forest-game pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}#black-forest-game .logitem{padding:12px 0;border-bottom:1px solid var(--bf-line);white-space:pre-line;font-size:13px}#black-forest-game .sectiontitle{margin-bottom:14px}#black-forest-game .badge{display:inline-block;background:var(--bf-tint);padding:3px 9px;border-radius:4px;font-size:12px}#black-forest-game .empty{padding:15px 0;color:var(--bf-dim)}
@media(max-width:700px){#black-forest-game{padding:20px 16px}#black-forest-game .layout{grid-template-columns:1fr}#black-forest-game aside{border-left:0;border-top:1px solid var(--bf-line);padding:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}#black-forest-game .stats{grid-template-columns:1fr 1fr}#black-forest-game .classcards{grid-template-columns:1fr}#black-forest-game .classcards button{padding:14px}#black-forest-game h1{font-size:25px}#black-forest-game .story{min-height:0}#black-forest-game .sideblock{margin:0}}@media(max-width:370px){#black-forest-game .actions{grid-template-columns:1fr}#black-forest-game aside{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#black-forest-game button{transition:none}}
#black-forest-game .layout{grid-template-columns:minmax(0,1fr) 245px}#black-forest-game .campnav{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bf-line);padding-top:18px;margin-top:22px}#black-forest-game .campnav button{flex:1 1 130px}#black-forest-game .campnav span{display:block;font-size:12px}#black-forest-game .gear p{overflow-wrap:anywhere}#black-forest-game .gear .rarity{font-size:11px;border-radius:4px;background:var(--bf-tint);padding:2px 5px}#black-forest-game .grade-3 .rarity{background:light-dark(#ede1fa,#3c2c52);color:light-dark(#5e3287,#dbc2ff)}#black-forest-game .grade-4 .rarity{background:light-dark(#f4e5bd,#52421c);color:light-dark(#795613,#ffdc84)}#black-forest-game .grade-5 .rarity{background:light-dark(#f6d8ce,#5c2d29);color:light-dark(#993c26,#ffc3ae)}#black-forest-game .compare{margin-top:14px}#black-forest-game .gear{margin:6px 0}#black-forest-game .eventdetails{margin-bottom:18px}#black-forest-game .joblist{display:grid;grid-template-columns:1fr 1fr;gap:16px}#black-forest-game .tablewrap{overflow-x:auto;margin:16px 0}#black-forest-game table{border-collapse:collapse;width:100%;font-size:12px}#black-forest-game td,#black-forest-game th{padding:8px;border-bottom:1px solid var(--bf-line);text-align:right;white-space:nowrap}#black-forest-game td:first-child,#black-forest-game th:first-child{text-align:left}#black-forest-game .collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 22px}#black-forest-game .collectionitem{color:var(--bf-dim);font-size:12px;padding:7px;background:var(--bf-panel);border-radius:4px}#black-forest-game .collectionitem.found{color:var(--bf-ink);background:var(--bf-tint)}#black-forest-game aside .gear .muted{font-size:12px}#black-forest-game .panel h3{margin-bottom:10px}#black-forest-game .panel>button{margin-top:14px}@media(max-width:700px){#black-forest-game .layout{grid-template-columns:1fr}#black-forest-game .joblist{grid-template-columns:1fr}#black-forest-game .collection{grid-template-columns:repeat(2,minmax(0,1fr))}}
#black-forest-game .commandrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px;border-top:1px solid var(--bf-line);padding-top:14px}#black-forest-game .commandrow input{flex:1 1 180px;min-width:0;font:16px/1.5 system-ui;padding:10px;border:1px solid var(--bf-line);border-radius:6px;color:var(--bf-ink);background:var(--bf-panel)}#black-forest-game .commandrow p{flex-basis:100%}#black-forest-game aside .flavor{display:none}#black-forest-game .flavor{font-style:italic;margin:6px 0}

/* Native touch taps and keyboard activation share one guarded action handler. */
#black-forest-game button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(80,140,90,.2)}
#bf-runtime-status{padding:12px;border:1px solid var(--bf-danger);border-radius:8px;margin-bottom:16px;overflow-wrap:anywhere}
#bf-runtime-status[hidden]{display:none}


/* Illustrated card edition: images never intercept gameplay input. */
#black-forest-game .hero-art{width:100%;aspect-ratio:16/7;object-fit:cover;object-position:center 60%;display:block;border-radius:12px;margin:0 0 20px;border:1px solid var(--bf-line)}
#black-forest-game .scene-intro{display:grid;grid-template-columns:155px minmax(0,1fr);gap:22px;align-items:start;margin:18px 0 22px}
#black-forest-game .scene-intro.no-art{display:block}
#black-forest-game .art-card{position:relative;margin:0;aspect-ratio:2/3;width:100%;border:1px solid #9b8553;border-radius:10px;padding:5px;background:#17231f;box-shadow:0 5px 15px #0003;overflow:hidden;pointer-events:none}
#black-forest-game .art-card:after{content:'';position:absolute;inset:9px;border:1px solid #cfb47766;border-radius:4px;pointer-events:none}
#black-forest-game .art-card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px}
#black-forest-game .art-card figcaption{position:absolute;bottom:5px;left:5px;right:5px;padding:34px 10px 12px;color:#f4ead0;text-align:center;background:linear-gradient(transparent,#0b1316ed);font:500 14px/1.4 Georgia,serif;text-shadow:0 2px 4px #000}
#black-forest-game .art-card.boss{border-color:#d9a458;box-shadow:0 0 15px #bf882433}
#black-forest-game .scene-copy h2{margin:7px 0 0}#black-forest-game .scene-copy .story{margin-bottom:0}
#black-forest-game .classcards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
#black-forest-game .classcards button{overflow:hidden;padding:7px;border-color:#998150;background:var(--bf-panel);border-radius:12px}
#black-forest-game .class-portrait{display:block;aspect-ratio:2/3;width:100%;border-radius:7px;background-size:300% 200%;background-repeat:no-repeat;background-color:#162520;margin-bottom:12px;pointer-events:none}
#black-forest-game .classcards button>b,#black-forest-game .classcards button>p{display:block;margin:7px 7px;font-size:13px}#black-forest-game .classcards button>b{font-size:16px}

<div id="black-forest-game">
<header class="top"><div><p class="eyebrow">THE LAST EMBER · TEXT RPG</p><h1>검은 숲의 방랑자</h1><p class="muted">마지막 불씨 · 잊힌 비전 2.0</p></div><button type="button" data-ui="save" class="small cursor-interaction">저장 / 불러오기</button></header>
<div id="bf-runtime-status" role="status">게임을 준비하고 있습니다. 이 문구가 계속 보이면 현재 화면에서 JavaScript가 실행되지 않은 상태입니다. 다운로드 미리보기 대신 HTML 실행을 지원하는 브라우저 페이지에서 열어 주세요.</div>
<noscript><p>이 화면에서는 JavaScript 실행이 차단되어 버튼이 작동하지 않습니다.</p></noscript>
<div id="bf-stats"></div>
<div id="bf-play"></div>
<section class="panel" id="bf-panel" hidden></section>
<footer class="footer"><span class="muted" id="bf-save-status" aria-live="polite">직업을 선택하면 모험이 시작됩니다.</span><div class="row"><button type="button" class="small cursor-interaction" data-ui="journal">모험 기록</button><button type="button" class="small cursor-interaction" data-ui="credits">제작 정보</button><button type="button" class="small cursor-interaction" data-ui="restart">새 모험</button></div></footer>
</div>

<script>

</script>

const side=`<aside><div class="sideblock"><p class="eyebrow">EQUIPMENT</p>${game.equipment().map(d=>`<div class="item">${gearCard(d)}</div>`).join('')}</div><div class="sideblock"><p class="eyebrow">SUPPLIES</p><p>물약 ${s.potions} · 각성 인장 ${s.sigils}</p><p class="muted">목재 ${s.wood} · 광석 ${s.ore} · 약초 ${s.herb}</p><p class="muted">캠프 Lv.${s.camp} · 자비 ${s.mercy}</p></div><div class="sideblock"><p class="eyebrow">DESTINY</p><p>지역 ${s.cleared.length}/8 · 비전 ${s.unlocked.length}/6</p><p class="muted">전설 보정 ${s.pity}/29</p><p class="muted">치명타 ${Math.round(game.crit()*100)}% · 회피 ${Math.round(game.dodge()*100)}%</p>${menu('도감 / 확률표','codex','small')}</div></aside>`;
$('play').innerHTML=`<div class="layout"><main class="main"><div class="scene-intro ${sceneArt(s)?'':'no-art'}">${sceneArt(s)}<div class="scene-copy"><p class="eyebrow">${kicker}</p><h2>${esc(title)}</h2><div class="story" aria-live="polite">${esc(s.message)}</div></div></div>${s.scene!=='camp'?extra:''}<div class="actions">${actions}</div>${s.scene==='camp'?extra:''}</main>${side}</div><form id="bf-command-form" class="commandrow"><label for="bf-command">직접 입력</label><input id="bf-command" type="text" maxlength="80" autocomplete="off" placeholder="예: 공격, 방어, 물약, 1번 선택"><button type="submit" class="cursor-interaction">실행</button><p class="muted" id="bf-command-status" role="status">지원 명령: 공격 · 스킬 · 방어 · 물약 · 도주 · 휴식 · 귀환 · 계속 · 1/2/3</p></form>`;
}
function showPanel(type){panel=type;const el=$('panel'),s=game.s;el.hidden=false;const close=menu('닫기','close','small');let html='';
if(type==='save')html=`<h3>저장 / 불러오기</h3><p class="muted">압축된 BF2 저장 코드를 보관해 다른 기기에서 이어 하세요. 이전 버전의 JSON 저장 코드도 읽을 수 있습니다. 불러오기는 현재 진행을 대체합니다.</p><label class="muted" for="bf-code">저장 코드</label><textarea id="bf-code" spellcheck="false"></textarea><div class="row">${menu('전체 선택','copy')}${menu('코드 불러오기','load','primary')}${close}</div><p id="bf-code-status" role="status" class="muted"></p>`;
if(type==='restart')html=`<h3>새로운 모험</h3><p class="muted">해금 직업·장비 도감·엔딩 기록은 유지됩니다. 레벨·장비·재화·탐험 진행은 초기화됩니다. 8개 지역 완주 후 새 모험은 적 능력치가 15%씩 증가합니다. 현재 기록은 저장 코드로 별도 보관할 수 있습니다.</p><div class="row">${menu('해금 유지 · 새 모험','confirm-restart','primary')}${close}</div>`;
if(type==='journal')html=`<h3>모험 기록</h3>${s.log.length?s.log.map(t=>`<div class="logitem">${esc(t)}</div>`).join(''):'<p>아직 기록이 없습니다.</p>'}${close}`;
if(type==='jobs')html=`<h3>직업 비전서</h3><p class="muted">조건 달성 후 각성 인장 1개로 비전을 해금합니다. 인장은 보스·비밀 방에서 확정, 일반 적 8%·정예 15%를 기본으로 드롭합니다.</p><div class="joblist">${Object.entries(JOBS).map(([id,j])=>{const unlocked=!j.hidden||s.unlocked.includes(id),eligible=game.eligible(id),available=game.jobAvailable(id);return `<div class="item"><h3>${unlocked?j.name:eligible?'발견: '+j.name:'??? · '+j.hint}</h3><p class="muted">${unlocked?(j.tier?'T'+j.tier+' · '+j.passive+' — ':'')+j.desc:j.requirement}</p>${unlocked?b(s.job===id?'현재 직업':'전직하기','changeJob',id,j.tier>1?'Lv.'+(j.tier===2?4:8)+' · 보스 '+(j.tier===2?1:3)+'명 필요':'',s.job===id||!available):b('비전 해금 · 인장 1','awaken',id,eligible?'조건 충족':'조건 미충족',!eligible||s.sigils<1)}</div>`}).join('')}</div><p class="muted">현재: 자비 ${s.mercy}, 보스 ${s.cleared.length}, 위기 후 승리 ${s.lowhpWins}, 처치 ${s.kills}, 정예 ${s.elites}, 제작 ${s.crafts}, 보급함 ${s.caches}, 희귀 이상 획득 ${s.rareFinds}, 비밀 ${s.secrets}</p>${close}`;
if(type==='workshop')html=`<h3>제작 / 강화</h3><p class="muted">+5까지 확정. +6/7/8 성공률 80/60/40%. 실패해도 장비·강화 수치 유지, 재료는 소모됩니다. 같은 강화 단계에서 2회 연속 실패하면 다음 시도는 확정입니다.</p><div class="actions">${b('물약 제작','craft','','약초 3',s.herb<3)}${b(s.camp>=8?'캠프 최대 레벨':'캠프 Lv.'+(s.camp+1),'campUp','',`목재 ${8*s.camp} · ${15*s.camp}G`,s.camp>=8||s.wood<8*s.camp||s.gold<15*s.camp)}${game.equipment().map(d=>b(`${slotLabel[d.slot]} +${d.plus>=8?'8 완료':d.plus+1}`,'upgrade',d.slot,`${Math.round(game.upgradeChance(d.slot)*100)}% · ${20*(d.plus+1)}G · 광석 ${3*(d.plus+1)}`,d.plus>=8||s.gold<20*(d.plus+1)||s.ore<3*(d.plus+1))+b(slotLabel[d.slot]+' 옵션 재설정','reforge',d.slot,'마지막 옵션 무작위 변경 · 40G · 광석 4',!d.affixes.length||s.gold<40||s.ore<4)).join('')}</div>${close}`;
if(type==='bag')html=`<h3>장비 가방 ${s.bag.length}/40</h3><p class="muted">가득 차면 가장 오래된 보관 장비를 자동 분해합니다.</p>${s.bag.map((d,i)=>`<div class="item">${gearCard(d)}<div class="row">${b('장착','equipBag',i)}${b('판매 '+game.price(d)+'G','sellBag',i)}${b('분해 · 광석 '+(2+d.grade),'salvage',i)}</div></div>`).join('')||'<p class="empty">보관된 장비가 없습니다.</p>'}${close}`;
if(type==='quests')html=`<h3>의뢰 게시판</h3>${game.quests().map(q=>`<div class="item"><p>${q.name} · ${Math.min(q.now,q.max)}/${q.max}</p><p class="muted">${q.text} · 보상 ${q.gold}G + 물약 1</p>${b(s.claims.includes(q.id)?'수령 완료':'보상 받기','claim',q.id,'',s.claims.includes(q.id)||q.now<q.max)}</div>`).join('')}${close}`;
if(type==='story')html=`<h3>찢어진 도서계</h3><p>각 세계의 마지막 장이 찢어지며 검은 숲에 봉합됐다. 여덟 인장을 되찾는 동안 세 사건을 원하는 순서로 해결하고 누구에게 결말을 맡길지 선택한다.</p>${FACTIONS.map(f=>`<div class="item"><h3>${f.name} · 신뢰 ${s.factions[f.id]}</h3><p>${f.goal}</p><p class="muted">${f.leaders} · ${f.benefit}</p></div>`).join('')}<h3>세 갈래의 메인 퀘스트</h3>${Object.entries(THREADS).map(([id,t])=>`<div class="item"><p>${t.name} · ${s.threads[id]}/2</p><p class="muted">${Object.entries(s.decisions).filter(([k])=>k.startsWith(id)).map(([,v])=>esc(v)).join(' → ')}</p>${b(s.threads[id]===2?'해결 완료':'사건을 살핀다','thread',id,'첫 지역 보스 이후 개방',s.threads[id]===2||s.cleared.length<1)}</div>`).join('')}${close}`;
if(type==='codex'){const odds=Object.entries(WEIGHTS).map(([id,w])=>`<tr><td>${{normal:'일반',elite:'정예·상인',boss:'보스',secret:'비밀 방'}[id]}</td>${w.map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('');html=`<h3>장비 도감 / 확률표</h3><p class="muted">기본 장비 등급 확률입니다. 행운은 영웅 이상 가중치를 1~2배로 높이고 전체를 다시 정규화합니다. 29회 연속 전설 미만이면 다음 장비는 전설 이상입니다. 현재 ${s.pity}/29.</p><div class="tablewrap"><table><thead><tr><th>획득처</th>${RARITIES.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${odds}</tbody></table></div><p class="muted">장비 등장: 일반 적 55%+행운, 정예·보스 100%. 비밀 방 기본 경로 가중치 5/100; 11회 탐험 동안 발견하지 못하면 비밀 경로가 확정 제시됩니다. 미지의 길에도 비밀 방이 숨어 있습니다. 보급함의 미믹 확률은 10%입니다.</p><h3>발견한 장비 ${s.collection.length}/${ITEMS.length}</h3><div class="collection">${ITEMS.map(d=>`<span class="collectionitem ${s.collection.includes(d.id)?'found':''}">${s.collection.includes(d.id)?d.name:'??? · '+slotLabel[d.slot]}</span>`).join('')}</div><h3>몬스터 기록 ${Object.keys(s.bestiary).length}종</h3><p class="muted">${Object.entries(s.bestiary).map(([n,v])=>`${esc(n)} ${v}회`).join(' · ')||'처치한 몬스터가 없습니다.'}</p>${close}`}
if(type==='credits')html=`<h3>게임 원화</h3><p class="muted">숲·캠프·수호자 원화: Google Gemini. 직업·몬스터 계열 카드: OpenAI 이미지 생성. </p><h3>실제 도입한 오픈소스</h3><p><a href="https://github.com/ondras/rot.js" target="_blank" rel="noopener">rot.js 2.2.1</a> — 시드 난수·상태 복원.</p><p><a href="https://github.com/jotson/LootTable.js" target="_blank" rel="noopener">LootTable.js 0.1.0</a> — 장비 등급·갈림길·적 행동 가중치 추첨. 난수 주입을 위한 작은 수정을 적용했습니다.</p><p><a href="https://github.com/pieroxy/lz-string" target="_blank" rel="noopener">lz-string 1.5.0</a> — 저장 코드 압축·복원.</p><p class="muted">직업·무기·몬스터·이야기·게임 규칙은 이 확장판의 자체 콘텐츠입니다. 확률은 게임 내 재화에만 적용됩니다.</p><details><summary>라이선스 전문</summary><pre id="bf-license"></pre></details>${close}`;
el.innerHTML=html;if(type==='save')$('code').value=game.export();if(type==='credits')$('license').textContent=root.dataset.license||'';
}
const commands=['start','travel','choose','act','retreat','advance','rest','buy','event','takeLoot','revive','finish','postgame','craft','campUp','upgrade','reforge','equipBag','sellBag','salvage','claim','awaken','changeJob','thread','dialogue'];
function activateButton(target){if(!target||target.disabled||!root.contains(target))return;const cmd=target.dataset.cmd;if(cmd){if(!commands.includes(cmd))return;const arg=target.dataset.arg,numeric=['travel','choose','event','finish','equipBag','sellBag','salvage','dialogue'];game[cmd](numeric.includes(cmd)?Number(arg):arg);render();save();if(['workshop','bag','quests','jobs','story'].includes(panel)&&game.s.scene==='camp')showPanel(panel);else{$('panel').hidden=true;panel=''}return}
const type=target.dataset.ui;if(type==='close'){$('panel').hidden=true;panel='';return}if(type==='confirm-restart'){game=game.newJourney();render();save();$('panel').hidden=true;panel='';return}if(type==='copy'){$('code').select();$('code-status').textContent='Ctrl+C 또는 복사 메뉴로 코드를 복사하세요.';return}if(type==='load'){try{const loaded=Game.load($('code').value);game=loaded;render();save();$('panel').hidden=true;panel=''}catch(e){$('code-status').textContent='불러오기 실패. 올바른 저장 코드를 넣어 주세요. 현재 진행은 유지됩니다.';$('code-status').className='error'}return}if(['workshop','bag','quests','jobs','story'].includes(type)&&game.s.scene!=='camp')return;if(type)showPanel(type)
}
function activateSafely(target){try{activateButton(target)}catch(error){const status=$('runtime-status');status.hidden=false;status.textContent='버튼 처리 오류: '+error.message+' · 저장 코드를 보관한 후 다시 열어 주세요.';console.error(error)}}
root.addEventListener('error',ev=>{if(ev.target.tagName==='IMG'){ev.target.hidden=true;ev.stopPropagation()}},true);
let touchStart=null,lastTouch=0;
root.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse'||!ev.isPrimary)return;const target=ev.target.closest('button');if(!target||target.disabled)return;touchStart={id:ev.pointerId,target,x:ev.clientX,y:ev.clientY,scroll:window.scrollY,moved:false}});
root.addEventListener('pointermove',ev=>{if(touchStart&&touchStart.id===ev.pointerId&&(Math.abs(ev.clientX-touchStart.x)>10||Math.abs(ev.clientY-touchStart.y)>10))touchStart.moved=true});
root.addEventListener('pointercancel',()=>{touchStart=null});
root.addEventListener('pointerup',ev=>{const start=touchStart;touchStart=null;if(!start||start.id!==ev.pointerId||start.moved||Math.abs(window.scrollY-start.scroll)>5||Math.abs(ev.clientX-start.x)>10||Math.abs(ev.clientY-start.y)>10||ev.target.closest('button')!==start.target)return;lastTouch=Date.now();ev.preventDefault();activateSafely(start.target)});
root.addEventListener('click',ev=>{if(ev.detail!==0&&Date.now()-lastTouch<750){ev.preventDefault();return}activateSafely(ev.target.closest('button'))});
root.addEventListener('submit',ev=>{if(ev.target.id!=='bf-command-form')return;ev.preventDefault();const text=$('command').value.trim(),s=game.s;let selector='';const n=text.match(/^(?:선택\s*)?([1-3])(?:번|번 선택| 선택)?$/);if(n){selector=`[data-cmd="${s.scene==='map'?'choose':s.scene==='event'?'event':s.scene==='dialogue'?'dialogue':'none'}"][data-arg="${Number(n[1])-1}"]`}else{const aliases={'공격':'attack','공격한다':'attack','스킬':'skill','방어':'defend','물약':'potion','회복':'potion','도주':'flee'};if(aliases[text])selector=`[data-cmd="act"][data-arg="${aliases[text]}"]`;else if(text==='휴식')selector='[data-cmd="rest"]';else if(text==='귀환'||text==='캠프로')selector='[data-cmd="retreat"]';else if(text==='계속')selector='[data-cmd="advance"]'}const target=selector?root.querySelector('#bf-play '+selector):null;if(target&&!target.disabled)target.click();else $('command-status').textContent='지금 실행할 수 없는 명령입니다. 화면의 선택지 또는 지원 명령을 입력하세요.';});render();root.dataset.ready='1';$('runtime-status').hidden=true;if(warning)$('save-status').textContent=warning;else if(game.s.job)save();
})();

</script>

</body></html>
